<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09111e"><title>必要週数シミュレーター｜エリン調査ノート</title><link rel="stylesheet" href="../assets/site.css"><script defer src="../assets/site.js"></script><script defer src="../assets/weeklyplanner.js"></script></head><body><div id="siteNav" data-current="tools" data-root="../"></div><main class="portal-wrap"><section class="job-hero"><div class="portal-kicker">WEEKLY REWARD CALCULATOR</div><h1 class="portal-page-title">交換ルーンの必要週数</h1><p class="portal-lead">今ある通貨、初回ボーナス、週に集められる数から、選択箱までの必要週数を計算します。コンテンツや期間で報酬が変わるので実測値を優先してください。</p></section><nav class="content-jumps"><a href="../content/index.html">コンテンツ一覧</a><a href="../content/rune-sources.html">報酬詳細</a><a href="../content/season1.html">韓国S1</a></nav><section class="portal-panel planner-panel"><h2>交換目標</h2><div class="planner-grid"><label>商品<select id="planItem"><option value="raid-armour">グラスギブネン防具選択箱（70）</option><option value="raid-emblem">グラスギブネンエンブレムランダム箱（50）</option><option value="abyss-emblem">アビスエンブレム選択壺（消費1,200＋900）</option><option value="tab-armour">タバルタス防具選択箱（120）</option><option value="tab-emblem">タバルタス未所持エンブレム箱（120）</option><option value="tab-enchant">タバルタス武器エンチャント（150）</option></select></label><label>週の獲得数（個）<input id="planWeekly" type="number" min="0" max="100000" value="10" inputmode="numeric"></label><label>現在の所持数（個）<input id="planOwned" type="number" min="0" max="100000" value="0" inputmode="numeric"></label><label>初回限定ボーナス・受取予定（個）<input id="planFirst" type="number" min="0" max="100000" value="0" inputmode="numeric"></label><label>希望する箱の数<input id="planCount" type="number" min="1" max="100" value="1" inputmode="numeric"></label><label id="spentHolder" class="planner-conditional">すでに交換条件のために消費した赤石（個）<input id="planSpent" type="number" min="0" max="1200" value="0" inputmode="numeric"></label></div><div class="planner-presets"><button type="button" data-preset="10">EASY 10/週</button><button type="button" data-preset="20">HARD 20/週</button><button type="button" data-preset="30">VERY HARD 30/週</button><button type="button" data-preset="240">HELL1赤石 240/週</button><button type="button" data-preset="16">タバルタス 16/週</button></div><div id="plannerResult" class="planner-result" aria-live="polite"></div><p class="content-small">計算は毎週同じ量を獲得し、ほかに使わない場合の最短週数です。最初の受領週を「1週目」と数えます。実際の解放日・装備条件・イベント配布は加味しません。アビスの1,200累計消費条件は入力欄で管理します。</p></section></main></body></html>
